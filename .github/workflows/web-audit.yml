# web-audit — weekly rot alarm for the embedded web dashboard
# (F1 maintenance contract, bd-ws5-ship-or-cut-jv0rc.1 / .1.2).
#
# The dashboard ships as a static export (output: 'export') embedded via
# go:embed, so Next/React are BUILD-TIME dependencies only — no Node server
# ships and server-side Next CVEs do not apply to the shipped artifact. The
# residual exposure is client-side JS plus build-time rot. This job makes
# that rot loud within a week instead of at release time:
#   - `npm audit --omit=dev` — production-dependency advisories
#   - `next build` — the export still compiles
#
# CONTRACT: a red run of this job BLOCKS the next release's G4 pre-flight
# (scripts/release_preflight.sh is STEP 0 of the DSR checklist; the operator
# must not release over a red web-audit without a waiver bead). KILL
# CRITERION (Q4, recorded on bd-ws5-ship-or-cut-jv0rc.1): red for >30 days,
# or two consecutive releases shipping with a web waiver, demotes the web UI
# to source-only in the next minor.
name: Web Audit

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-audit.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-audit:
    name: Web Audit (npm audit + static export build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build static export
        run: npm run build

      - name: Assert export produced the route tree
        run: |
          test -f out/index.html
          test -f out/memory/index.html
          test -f out/agents/index.html
          ! grep -ri "coming soon" out/agents/index.html
